[project]
name = "edge-rag"
version = "0.1.0"
description = "Tournament harness for retrieval strategies, built from concept-embeddings-RAG"
requires-python = ">=3.12,<3.13"
# Every library that can move a recorded number is pinned to the version the old project
# measured with (old uv.lock): numpy 2.5.2 and scipy 1.18.1 off linux x86_64, bm25s 0.3.11.
dependencies = [
    "numpy==2.5.2 ; sys_platform != 'linux' or platform_machine != 'x86_64'",
    # vllm 0.30.0 (group `pod`) needs numba 0.65.0, hence numpy < 2.5: the old lock's pod value.
    "numpy==2.3.5 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "scipy==1.18.1",
    "bm25s==0.3.11",
    "torch==2.13.0",
    "transformers==5.16.1",
    "tokenizers==0.23.1",
]

[project.scripts]
edge-rag = "edge_rag.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Phase 02 ghosts (plan D4), synced on the rented Linux x86_64 pod only: G-R (J-strong's
# CrossEncoder, at the version Phase 17 measured with) and G-A1 (vLLM). G-L runs in its own
# environment, `src/edge_rag/pod/colbert_env`, because PyLate pins an older torch.
pod = [
    "sentence-transformers==6.0.1 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "vllm==0.30.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    # Declared so that `tool.uv.sources` routes them to the cu126 index (remote-gpu trap).
    "torchvision==0.28.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torchaudio==2.11.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'x86_64'" },
]
# vllm 0.30.0 pulls torchvision and torchaudio from PyPI, built for CUDA 13; they refuse to
# import next to torch cu126 (old Phase 17 pod). Nothing resolves them off the pod platform.
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".claude", "data", ".venv", "node_modules"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Recorded digests, not secrets.
"src/edge_rag/config.py" = ["S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
